name: PocketLocket
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

schemes:
  # Declared so the one documented `xcodebuild -scheme PocketLocket test` keeps
  # running every test bundle. XcodeGen's auto-generated scheme only picks up
  # test targets that depend on the app, and the widget tests deliberately don't.
  PocketLocket:
    build:
      targets:
        PocketLocket: all
        PocketLocketWidget: all
    test:
      targets:
        - PocketLocketTests
        - PocketLocketWidgetTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Building the extension on its own. Because the only build target is an
  # appex, Xcode offers this scheme with "Wait for the executable to be
  # launched", which is how you attach a debugger to the widget process.
  PocketLocketWidget:
    build:
      targets:
        PocketLocketWidget: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_LANGUAGE: en
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  PocketLocket:
    type: application
    platform: iOS
    sources:
      - path: PocketLocket
      # Shared with the widget extension: a widget cannot open the SwiftData
      # store, so both binaries compile the snapshot layer and the category
      # types it is built from. JSON is the only thing that crosses the
      # boundary. (Compiled twice on purpose -- app and extension are separate
      # executables, so there is no duplicate-symbol conflict.)
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PocketLocket
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PocketLocket
        INFOPLIST_FILE: PocketLocket/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PocketLocket/Resources/PocketLocket.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      # Embeds the extension in the app bundle's PlugIns/, which is what makes
      # the widget appear in the gallery.
      - target: PocketLocketWidget

  PocketLocketWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PocketLocketWidget
      - path: Shared
      # Compiled into both binaries so the snapshot's Codable types mean the same
      # thing on each side of the App Group boundary.
      - path: PocketLocket/Models/SpendCategory.swift
      - path: PocketLocket/Models/SpendAggregator.swift
    settings:
      base:
        PRODUCT_NAME: PocketLocketWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PocketLocket.Widget
        INFOPLIST_FILE: PocketLocketWidget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PocketLocketWidget/Resources/PocketLocketWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  PocketLocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketLocketTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PocketLocketTests
    dependencies:
      - target: PocketLocket

  # Renders the widget layouts. It has to be its own bundle: an app extension's
  # sources aren't part of the app binary, so PocketLocketTests can't reach them.
  # It recompiles the widget's sources the same way the extension itself does —
  # Shared/ plus the two model files — and deliberately has no host app, so no
  # type is ever defined twice in one process.
  PocketLocketWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketLocketWidgetTests
      - path: PocketLocketWidget
        excludes:
          # Two @main entry points in one binary would fail to link.
          - PocketLocketWidgetBundle.swift
      - path: Shared
      - path: PocketLocket/Models/SpendCategory.swift
      - path: PocketLocket/Models/SpendAggregator.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PocketLocketWidgetTests
